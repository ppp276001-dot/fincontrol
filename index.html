<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>FinControl</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">F</span><div><b>FinControl</b><small>Personal + Business</small></div></div>
    <nav id="nav">
      <button class="nav-btn active" data-view="dashboard">▦ <span>Dashboard</span></button>
      <button class="nav-btn" data-view="transactions">⇄ <span>Transactions</span></button>
      <button class="nav-btn" data-view="cards">▣ <span>Credit cards</span></button>
      <button class="nav-btn" data-view="accounts">◫ <span>Bank accounts</span></button>
      <button class="nav-btn" data-view="deals">◇ <span>Deals & commissions</span></button>
      <button class="nav-btn" data-view="reminders">◷ <span>Reminders</span></button>
      <button class="nav-btn" data-view="import">⇧ <span>Import / backup</span></button>
    </nav>
    <div class="sidebar-foot"><span class="privacy-dot"></span> Stored on this device</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div class="eyebrow">FINANCIAL CONTROL CENTRE</div><h1 id="page-title">Dashboard</h1></div>
      <div class="top-actions"><button id="theme-toggle" class="icon-btn" title="Toggle theme">☼</button><button class="primary" id="quick-add">＋ Add transaction</button></div>
    </header>
    <section id="view" aria-live="polite"></section>
    <footer>FinControl · Offline-first · Your records stay in this browser on this device</footer>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
